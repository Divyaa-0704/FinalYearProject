<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Parks Dashboard</title>
    
    <!-- jQuery & FontAwesome -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f4f4;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #046A38;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .sidebar a:hover, .sidebar .active {
            background-color: #034B2E;
        }

        /* Main Content */
        .content {
            flex-grow: 1;
            padding: 30px;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        select, button, input[type="color"] {
            padding: 10px;
            margin: 10px 5px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #046A38;
            color: white;
            cursor: pointer;
            border: none;
            padding: 10px 15px;
        }

        button:hover {
            background-color: #034B2E;
        }

        #graphContainer {
            margin-top: 20px;
            text-align: center;
        }

        #graphImage {
            max-width: 80%;
            height: auto;
            border: 1px solid #ccc;
            padding: 10px;
            background: white;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>National Parks Dashboard</h2>
        <a href="#" class="active"><i class="fas fa-home"></i> Home</a>
        <a href="#"><i class="fas fa-calendar"></i> Calendar</a>
        <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h2>National Park Data Dashboard</h2>

        <h3>Select a Table</h3>
        <select id="tableDropdown">
            <option value="">Loading Tables...</option>
        </select>

        <h3>Choose a Column</h3>
        <select id="columnDropdown">
            <option value="">Select a Column</option>
        </select>

        <h3>Graph Type</h3>
        <select id="graphTypeDropdown">
            <option value="bar">Bar Graph</option>
            <option value="line">Line Graph</option>
            <option value="pie">Pie Chart</option>
        </select>

        <h3>Custom Color</h3>
        <input type="color" id="colorPicker" value="#3498db">

        <br>
        <button onclick="fetchGraph()">Generate Graph</button>

        <div id="graphContainer">
            <img id="graphImage" src="" alt="Graph will appear here">
        </div>
    </div>

    <script>
        $(document).ready(function () {
            loadTables();

            $("#tableDropdown").change(function () {
                let selectedTable = $(this).val();
                if (selectedTable) {
                    loadColumns(selectedTable);
                } else {
                    $("#columnDropdown").html('<option value="">Select a Column</option>');
                }
            });

            $("#graphTypeDropdown").change(fetchGraph);
        });

        function loadTables() {
            $.get("/get_tables", function (data) {
                let tableDropdown = $("#tableDropdown");
                tableDropdown.empty().append('<option value="">Select a Table</option>');  
                if (data.tables) {
                    data.tables.forEach(table => {
                        tableDropdown.append(`<option value="${table}">${table}</option>`);
                    });
                }
            }).fail(() => {
                alert("Error loading tables.");
            });
        }

        function loadColumns(table) {
            $.post("/get_columns", { table: table }, function (data) {
                let columnDropdown = $("#columnDropdown");
                columnDropdown.empty().append('<option value="">Select a Column</option>');
                if (data.columns) {
                    data.columns.forEach(col => {
                        columnDropdown.append(`<option value="${col}">${col}</option>`);
                    });
                }
            }).fail(() => {
                alert("Error loading columns.");
            });
        }

        function fetchGraph() {
            let table = $("#tableDropdown").val();
            let column = $("#columnDropdown").val();
            let graphType = $("#graphTypeDropdown").val();
            let color = $("#colorPicker").val();

            if (!table || !column || !graphType) {
                alert("Please select all options before generating the graph.");
                return;
            }

            $.post("/generate_graph", { table, column, graph_type: graphType, color }, function(data) {
                if (data.graph_path) {
                    $("#graphImage").attr("src", data.graph_path + "?" + new Date().getTime()).show();
                } else {
                    alert(data.error || "Failed to generate graph.");
                }
            }).fail(() => {
                alert("Error generating graph.");
            });
        }
    </script>

</body>
</html>
